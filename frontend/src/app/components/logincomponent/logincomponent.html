<div class="login-fondo">
  <div class="card login-tarjeta shadow-sm">
    <div class="card-body p-4">
      <div class="text-center mb-4">
        <i class="bi bi-heart-pulse-fill text-warning login-logo"></i>
        <h1 class="h4 fw-bold mb-0 mt-2">SIGEVET</h1>
        <div class="text-secondary small">Huella Sana · Ingreso del personal</div>
      </div>

      <form (ngSubmit)="entrar()" #formulario="ngForm">
        <div class="mb-3">
          <label class="form-label small" for="email">Correo corporativo</label>
          <input id="email" type="email" class="form-control" name="email" [(ngModel)]="form.email"
                 placeholder="nombre@huellasana.co" autocomplete="username" required>
        </div>
        <div class="mb-3">
          <label class="form-label small" for="documento">Número de documento</label>
          <input id="documento" type="password" class="form-control" name="documento" [(ngModel)]="form.documento"
                 inputmode="numeric" autocomplete="current-password" required>
        </div>

        @if (error) { <div class="alert alert-danger py-2 small">{{ error }}</div> }

        <button type="submit" class="btn btn-dark w-100" [disabled]="enviando || formulario.invalid">
          <i class="bi bi-box-arrow-in-right me-1"></i>{{ enviando ? 'Entrando…' : 'Entrar' }}
        </button>
      </form>

      <p class="text-secondary small text-center mt-3 mb-0">
        Solo los empleados activos pueden entrar.
      </p>
    </div>
  </div>
</div>
