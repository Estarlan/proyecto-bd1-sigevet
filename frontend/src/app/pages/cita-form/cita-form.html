<a routerLink="/agenda" class="d-inline-block mb-3 small"><i class="bi bi-arrow-left me-1"></i>Volver a la agenda</a>

<div class="d-flex align-items-center gap-3 mb-4">
  <div class="icon-box"><i class="bi bi-calendar-plus-fill text-warning fs-4"></i></div>
  <div>
    <h4 class="fw-bold mb-0">Agendar cita</h4>
    <p class="text-muted mb-0 small">La cita queda PROGRAMADA</p>
  </div>
</div>

<form (ngSubmit)="guardar()">
  <div class="card tarjeta mb-3">
    <div class="card-body">
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label small" for="mascota">Mascota</label>
          <select id="mascota" class="form-select" name="idMascota" [(ngModel)]="form.idMascota" required>
            <option [ngValue]="null" disabled>Seleccione…</option>
            @for (m of mascotas; track m.idMascota) {
              <option [ngValue]="m.idMascota">{{ m.nombre }} · {{ m.especie }} · {{ m.cliente }}</option>
            }
          </select>
        </div>
        <div class="col-md-6">
          <label class="form-label small" for="servicio">Servicio</label>
          <select id="servicio" class="form-select" name="idServicio" [(ngModel)]="form.idServicio" required>
            <option [ngValue]="null" disabled>Seleccione…</option>
            @for (s of servicios; track s.id) {
              <option [ngValue]="s.id">{{ s.nombre }} ({{ s.detalle }}) · {{ s.valor | currency:'COP':'symbol-narrow':'1.0-0' }}</option>
            }
          </select>
        </div>
        <div class="col-md-6">
          <label class="form-label small" for="sede">Sede</label>
          <select id="sede" class="form-select" name="idSede" [(ngModel)]="form.idSede" (ngModelChange)="cambiarSede()" required>
            <option [ngValue]="null" disabled>Seleccione…</option>
            @for (s of sedes; track s.idSede) { <option [ngValue]="s.idSede">{{ s.nombre }}</option> }
          </select>
        </div>
        <div class="col-md-6">
          <label class="form-label small" for="veterinario">Veterinario <span class="text-muted">(solo los de la sede: RN-08)</span></label>
          <select id="veterinario" class="form-select" name="idVeterinario" [(ngModel)]="form.idVeterinario"
                  [disabled]="form.idSede === null" required>
            <option [ngValue]="null" disabled>{{ form.idSede === null ? 'Elija primero la sede' : 'Seleccione…' }}</option>
            @for (v of veterinarios; track v.id) { <option [ngValue]="v.id">{{ v.nombre }}</option> }
          </select>
        </div>
        <div class="col-md-6">
          <label class="form-label small" for="fechaHora">Fecha y hora</label>
          <input id="fechaHora" type="datetime-local" class="form-control" name="fechaHora" [(ngModel)]="form.fechaHora" [min]="ahora" required>
        </div>
        <div class="col-md-6">
          <label class="form-label small" for="motivo">Motivo <span class="text-muted">(opcional)</span></label>
          <input id="motivo" class="form-control" name="motivo" [(ngModel)]="form.motivo" maxlength="200">
        </div>
      </div>
    </div>
  </div>

  @if (error) { <div class="alert alert-danger">{{ error }}</div> }
  <div class="d-flex gap-2">
    <button type="submit" class="btn btn-dark" [disabled]="guardando">
      @if (guardando) { <span class="spinner-border spinner-border-sm me-1"></span> }
      Agendar
    </button>
    <a routerLink="/agenda" class="btn btn-link">Cancelar</a>
  </div>
</form>
