<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: cabeza(~{::title})}"><title>Inventario · SIGEVET</title></head>
<body>
<th:block th:replace="~{fragmentos :: cabecera}"></th:block>
<main id="contenido" class="container pagina" tabindex="-1">

<div class="pagina-heading"><p class="eyebrow">Disponibilidad de medicamentos</p><h2>Inventario por sede</h2><p>Las existencias inferiores al mínimo aparecen con la indicación «Stock bajo».</p></div>
<form method="get" class="filters">
  <label for="sede">Sede<select id="sede" name="sede"><option value="">Todas las sedes</option><th:block th:each="sede : ${opciones.sedes}"><option th:value="${sede.id_sede}" th:selected="${sede.id_sede.toString() == filtros['sede']}"><th:block th:text="${sede.nombre}"></th:block></option></th:block></select></label>
  <button type="submit">Filtrar</button><a th:href="@{/inventario}">Limpiar</a>
</form>
<section class="card"><h3>Medicamentos y existencias</h3>
<th:block th:if="${!#lists.isEmpty(filas)}"><div class="table-wrap" role="region" aria-label="Inventario de medicamentos" tabindex="0"><table>
  <thead><tr><th scope="col">Sede</th><th scope="col">Medicamento</th><th scope="col">Presentación</th><th scope="col">Stock actual</th><th scope="col">Stock mínimo</th><th scope="col">Disponibilidad</th><th scope="col">Actualización</th></tr></thead>
  <tbody><th:block th:each="fila : ${filas}"><tr th:classappend="${fila.stock_actual < fila.stock_minimo} ? 'low-stock'">
    <td><th:block th:text="${fila.sede}"></th:block></td><td><th:block th:text="${fila.medicamento}"></th:block></td><td><th:block th:text="${@formato.fecha(fila.presentacion)}"></th:block></td><td><th:block th:text="${@formato.fecha(fila.stock_actual)}"></th:block></td><td><th:block th:text="${@formato.fecha(fila.stock_minimo)}"></th:block></td><td><span class="badge"><th:block th:text="${fila.stock_actual < fila.stock_minimo ? 'Stock bajo' : 'Stock suficiente'}"></th:block></span></td><td><th:block th:text="${@formato.fecha(fila.fecha_actualizacion)}"></th:block></td>
  </tr></th:block></tbody>
</table></div></th:block><th:block th:if="${!(!#lists.isEmpty(filas))}"><div class="empty-state">No hay medicamentos registrados para esta sede.</div></th:block>
</section>

</main>
<footer th:replace="~{fragmentos :: pie}"></footer>
</body>
</html>
