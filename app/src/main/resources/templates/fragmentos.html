<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="cabeza(titulo)">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:replace="${titulo}">SIGEVET</title>
  <link rel="stylesheet" th:href="@{/estilos.css}">
</head>
<body>
<th:block th:fragment="cabecera">
  <a class="skip-link" href="#contenido">Ir al contenido</a>
  <header class="site-header">
    <div class="container brand"><div>
      <p class="eyebrow">Gestión veterinaria · Consulta de datos</p>
      <h1>SIGEVET — Red de Clínicas Veterinarias Huella Sana</h1>
    </div><span class="readonly">Solo lectura</span></div>
    <nav class="container nav" aria-label="Navegación principal">
      <a th:href="@{/}" th:attr="aria-current=${ruta == '/'} ? 'pagina' : null">Inicio</a>
      <a th:href="@{/clientes}" th:attr="aria-current=${ruta == '/clientes'} ? 'pagina' : null">Clientes</a>
      <a th:href="@{/agenda}" th:attr="aria-current=${ruta == '/agenda'} ? 'pagina' : null">Agenda</a>
      <a th:href="@{/inventario}" th:attr="aria-current=${ruta == '/inventario'} ? 'pagina' : null">Inventario</a>
      <a th:href="@{/facturas}" th:attr="aria-current=${ruta == '/facturas'} ? 'pagina' : null">Facturas</a>
      <a th:href="@{/personal}" th:attr="aria-current=${ruta == '/personal'} ? 'pagina' : null">Personal</a>
      <a th:href="@{/algebra}" th:attr="aria-current=${ruta == '/algebra'} ? 'pagina' : null">Álgebra relacional</a>
    </nav>
  </header>
</th:block>
<footer class="site-footer" th:fragment="pie"><div class="container">Universidad El Bosque · Bases de Datos 1<span>Huella Sana · SIGEVET</span></div></footer>
</body>
</html>
