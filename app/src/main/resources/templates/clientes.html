<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: cabeza(~{::title})}"><title>Clientes · SIGEVET</title></head>
<body>
<th:block th:replace="~{fragmentos :: cabecera}"></th:block>
<main id="contenido" class="container pagina" tabindex="-1">

<div class="pagina-heading"><p class="eyebrow">Personas y mascotas</p><h2>Clientes</h2><p>Consulta los datos de contacto, las mascotas y la facturación de cada cliente.</p></div>
<form method="get" class="filters"><label for="buscar">Documento o apellido<input id="buscar" name="buscar" th:value="${buscar}" type="search" placeholder="Buscar cliente"></label><button type="submit">Buscar</button><a th:href="@{/clientes}">Limpiar</a></form>
<section class="card">
  <p class="muted"><th:block th:text="${datos.total}"></th:block> cliente<th:block th:if="${datos.total != 1}">s</th:block> encontrado<th:block th:if="${datos.total != 1}">s</th:block>.</p>
  <div class="table-wrap" th:if="${!#lists.isEmpty(datos.filas)}"><table>
<thead><tr><th>Código</th><th>Nombres</th><th>Apellidos</th><th>Documento</th><th>Correo electrónico</th></tr></thead>
<tbody><tr th:each="fila : ${datos.filas}">
<td><a th:href="@{/clientes/{id}(id=${fila.id_cliente})}" th:text="${@formato.fecha(fila.id_cliente)}"></a></td>
<td th:text="${@formato.fecha(fila.nombres)}"></td>
<td th:text="${@formato.fecha(fila.apellidos)}"></td>
<td th:text="${@formato.fecha(fila.num_documento)}"></td>
<td th:text="${@formato.fecha(fila.email)}"></td>
</tr></tbody></table></div>
<p th:if="${#lists.isEmpty(datos.filas)}">No hay registros para mostrar.</p>
  <nav class="pagination" aria-label="Páginas de clientes">
    <th:block th:if="${pagina > 1}"><a th:href="@{/clientes(buscar=${buscar},pagina=${pagina - 1})}">← Anterior</a></th:block>
    <span>Página <th:block th:text="${pagina}"></th:block> de <th:block th:text="${totalPaginas}"></th:block></span>
    <th:block th:if="${pagina < totalPaginas}"><a th:href="@{/clientes(buscar=${buscar},pagina=${pagina + 1})}">Siguiente →</a></th:block>
  </nav>
</section>

</main>
<footer th:replace="~{fragmentos :: pie}"></footer>
</body>
</html>
