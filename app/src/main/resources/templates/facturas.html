<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Facturas · SIGEVET</title>
  <link rel="stylesheet" th:href="@{/estilos.css}">
</head>
<body>
<header th:replace="~{fragmentos/menu :: encabezado}"></header>
<main id="contenido" class="container pagina" tabindex="-1">
<h2>Facturas</h2>
<form method="get" class="filters">
<label for="sede">Sede<select id="sede" name="sede">
<option value="">Todas las sedes</option>
<option th:each="opcion : ${sedes}" th:value="${opcion.idSede}"
        th:text="${opcion.nombre}" th:selected="${opcion.idSede == sedeSeleccionada}"></option>
</select></label>
<label for="estado">Estado<select id="estado" name="estado">
<option value="">Todos los estados</option>
<option th:each="opcion : ${estados}" th:value="${opcion}" th:text="${opcion}"
        th:selected="${opcion == estadoSeleccionado}"></option>
</select></label>
<button type="submit">Filtrar</button><a th:href="@{/facturas}">Limpiar</a>
</form>
<section class="card"><h3>Facturas encontradas</h3>
<div class="table-wrap" th:if="${!#lists.isEmpty(facturas)}"><table>
<thead><tr><th scope="col">Número</th><th scope="col">Fecha</th><th scope="col">Cliente</th><th scope="col">Sede</th><th scope="col">Estado</th><th scope="col">Total</th></tr></thead>
<tbody><tr th:each="fila : ${facturas}">
<td><a th:href="@{/facturas/{id}(id=${fila.idFactura})}" th:text="${fila.numeroFactura}"></a></td>
<td><span th:text="${fila.fechaEmision}"></span></td>
<td><a th:href="@{/clientes/{id}(id=${fila.idCliente})}" th:text="${fila.cliente}"></a></td>
<td><span th:text="${fila.sede}"></span></td>
<td><span th:text="${fila.estado}"></span></td>
<td><span th:text="${fila.total == null ? '—' : '$ ' + #numbers.formatDecimal(fila.total, 1, 'POINT', 2, 'COMMA')}"></span></td>
</tr></tbody></table></div>
<p class="empty-state" th:if="${#lists.isEmpty(facturas)}">No hay registros para mostrar.</p>
</section>

</main>
<footer th:replace="~{fragmentos/menu :: pie}"></footer>
</body>
</html>
