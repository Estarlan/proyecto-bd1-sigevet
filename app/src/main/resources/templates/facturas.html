<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: cabeza(~{::title})}"><title>Facturas · SIGEVET</title></head>
<body>
<th:block th:replace="~{fragmentos :: cabecera}"></th:block>
<main id="contenido" class="container pagina" tabindex="-1">

<div class="pagina-heading"><p class="eyebrow">Facturación de la red</p><h2>Facturas</h2><p>Los totales incluyen la cantidad, el precio y el descuento de cada concepto.</p></div>
<form method="get" class="filters">
  <label for="sede">Sede<select id="sede" name="sede"><option value="">Todas las sedes</option><th:block th:each="sede : ${opciones.sedes}"><option th:value="${sede.id_sede}" th:selected="${sede.id_sede.toString() == filtros['sede']}"><th:block th:text="${sede.nombre}"></th:block></option></th:block></select></label>
  <label for="estado">Estado<select id="estado" name="estado"><option value="">Todos los estados</option><th:block th:each="estado : ${estados}"><option th:value="${estado}" th:selected="${estado == filtros['estado']}"><th:block th:text="${estado}"></th:block></option></th:block></select></label>
  <button type="submit">Filtrar</button><a th:href="@{/facturas}">Limpiar</a>
</form>
<section class="card"><h3>Facturas encontradas</h3>
<th:block th:if="${!#lists.isEmpty(filas)}"><div class="table-wrap" role="region" aria-label="Facturas" tabindex="0"><table>
  <thead><tr><th scope="col">Número</th><th scope="col">Fecha de emisión</th><th scope="col">Cliente</th><th scope="col">Sede</th><th scope="col">Estado</th><th scope="col">Total</th></tr></thead>
  <tbody><th:block th:each="fila : ${filas}"><tr><td><a th:href="@{/facturas/{id}(id=${fila.id_factura})}"><th:block th:text="${fila.numero_factura}"></th:block></a></td><td><th:block th:text="${@formato.fecha(fila.fecha_emision)}"></th:block></td><td><th:block th:text="${fila.cliente}"></th:block></td><td><th:block th:text="${fila.sede}"></th:block></td><td><span th:class="|badge badge-${#strings.toLowerCase(fila.estado)}|"><th:block th:text="${fila.estado}"></th:block></span></td><td><th:block th:text="${@formato.pesos(fila.total)}"></th:block></td></tr></th:block></tbody>
</table></div></th:block><th:block th:if="${!(!#lists.isEmpty(filas))}"><div class="empty-state">No hay facturas que coincidan con los filtros.</div></th:block>
</section>

</main>
<footer th:replace="~{fragmentos :: pie}"></footer>
</body>
</html>
