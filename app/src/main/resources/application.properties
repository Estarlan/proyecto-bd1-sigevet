spring.application.name=sigevet
server.port=5000
spring.datasource.url=${SIGEVET_DB_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
spring.datasource.username=${SIGEVET_DB_USER:VET_APP}
spring.datasource.password=${SIGEVET_DB_PASSWORD:}
spring.datasource.hikari.connection-init-sql=ALTER SESSION SET CURRENT_SCHEMA = VETDB
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.initialization-fail-timeout=-1
spring.thymeleaf.cache=true
sigevet.algebra=../database/03_varios/01_consultas_algebra_relacional.sql
